name: Build ErgoAngle Desk V3.1 APK

on:
  push:
    branches:
      - ergoangle-apk
      - ergoangle-consumer-v3
      - ergoangle-desk-v3-1
    paths:
      - 'ergoapp/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-ergoangle.yml'
  pull_request:
    branches:
      - main
      - ergoangle-apk
    paths:
      - 'ergoapp/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-ergoangle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download MediaPipe pose model
        run: |
          mkdir -p ergoapp/src/main/assets
          curl -L --fail --retry 3 \
            -o ergoapp/src/main/assets/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s ergoapp/src/main/assets/pose_landmarker_lite.task

      - name: Build ErgoAngle Desk V3.1 debug APK
        run: gradle --stacktrace :ergoapp:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find ergoapp/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/ErgoAngle-Desk-V3.1-debug.apk
          sha256sum dist/ErgoAngle-Desk-V3.1-debug.apk > dist/ErgoAngle-Desk-V3.1-debug.apk.sha256

      - name: Set up Python for real-image test
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MediaPipe Python test dependencies
        run: pip install --no-cache-dir mediapipe==0.10.21 pillow

      - name: Download same-person good-vs-slouched test image
        run: |
          mkdir -p testdata
          curl -L --fail --retry 3 \
            -o testdata/posture_compare.jpg \
            'https://img.dakohome.co.uk/JoWT-sEEqcpErBp26t6_SA/b4af4bee-4b69-4477-aead-95f40aa62600/thumb'
          test -s testdata/posture_compare.jpg

      - name: Run real-image MediaPipe V3.1 regression
        run: python tools/posture_image_test.py

      - name: Upload real-image test outputs
        uses: actions/upload-artifact@v4
        with:
          name: ErgoAngle-Desk-V3.1-RealImage-Test
          path: posture_test_output/*
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErgoAngle-Desk-V3.1-APK
          path: dist/*
          retention-days: 30
