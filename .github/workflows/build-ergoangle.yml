name: Build ErgoAngle APK

on:
  push:
    branches:
      - ergoangle-apk
    paths:
      - 'ergoangle/**'
      - '.github/workflows/build-ergoangle.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ergoangle/**'
      - '.github/workflows/build-ergoangle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore ErgoAngle project
        run: |
          base64 -d ergoangle/ErgoAngle_MVP_Android.zip.b64 > ErgoAngle_MVP_Android.zip
          unzip -q ErgoAngle_MVP_Android.zip
          mkdir -p ErgoAngle/app/src/main/assets
          test -f ErgoAngle/settings.gradle

      - name: Build debug APK
        working-directory: ErgoAngle
        run: gradle --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp ErgoAngle/app/build/outputs/apk/debug/app-debug.apk dist/ErgoAngle-debug.apk
          sha256sum dist/ErgoAngle-debug.apk > dist/ErgoAngle-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErgoAngle-APK
          path: dist/*
          retention-days: 30
