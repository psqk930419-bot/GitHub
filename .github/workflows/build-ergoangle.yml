name: Build ErgoAngle Desk V3.4 Verification

on:
  pull_request:
    branches:
      - ergoangle-desk-v3-3
    paths:
      - 'ergoapp/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-ergoangle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download MediaPipe pose model
        run: |
          mkdir -p ergoapp/src/main/assets
          curl -L --fail --retry 3 -o ergoapp/src/main/assets/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s ergoapp/src/main/assets/pose_landmarker_lite.task

      - name: Apply runtime patches
        run: |
          if [ -f tools/apply_side_profile_patch.py ]; then python tools/apply_side_profile_patch.py; fi
          if [ -f tools/apply_v32_ui_patch.py ]; then python tools/apply_v32_ui_patch.py; fi
          if [ -f tools/apply_v33_runtime_patch.py ]; then python tools/apply_v33_runtime_patch.py; fi
          if [ -f tools/apply_v34_target_lock.py ]; then python tools/apply_v34_target_lock.py; fi
          if [ -f tools/apply_v34_metadata_patch.py ]; then python tools/apply_v34_metadata_patch.py; fi

      - name: Run Android unit tests
        run: gradle --stacktrace :ergoapp:testDebugUnitTest

      - name: Build V3.4 APK
        run: gradle --stacktrace :ergoapp:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find ergoapp/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/ErgoAngle-Desk-V3.4-tested.apk
          sha256sum dist/ErgoAngle-Desk-V3.4-tested.apk > dist/ErgoAngle-Desk-V3.4-tested.apk.sha256

      - name: Set up Python for multi-person video test
        if: ${{ hashFiles('tools/target_lock_video_test.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install multi-person video test dependencies
        if: ${{ hashFiles('tools/target_lock_video_test.py') != '' }}
        run: pip install --no-cache-dir mediapipe==0.10.21 opencv-python-headless requests

      - name: Run real multi-person target-lock regression
        if: ${{ hashFiles('tools/target_lock_video_test.py') != '' }}
        run: python tools/target_lock_video_test.py

      - name: Upload target-lock video results
        if: ${{ hashFiles('tools/target_lock_video_test.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ErgoAngle-V3.4-TargetLock-Video-Test
          path: target_lock_output/*
          retention-days: 30

      - name: Upload V3.4 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErgoAngle-Desk-V3.4-Tested-APK
          path: dist/*
          retention-days: 30
